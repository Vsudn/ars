<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#f9a8d4">
<title>ARS Super Store - QR Product Reader</title>
<style>
  :root { --pink:#fce7f3; --pink-dark:#db2777; --card:#fff; --text:#000; --muted:#374151; --border:#f3c4dd; --danger:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--pink); color:var(--text); min-height:100dvh; font-size:16px; line-height:1.45; padding-bottom:40px; }
  header { background:var(--pink-dark); color:#fff; text-align:center; padding:calc(16px + env(safe-area-inset-top)) 16px 16px; position:sticky; top:0; z-index:10; }
  header h1 { font-size:1.3rem; font-weight:800; }
  header p { font-size:.78rem; opacity:.95; margin-top:2px; }
  main { max-width:640px; margin:0 auto; padding:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  h2 { font-size:1.1rem; margin-bottom:10px; }
  input { width:100%; height:48px; padding:0 14px; border:1px solid #d1d5db; border-radius:12px; font-size:16px; background:#fff; color:var(--text); }
  input:focus { outline:2px solid var(--pink-dark); border-color:transparent; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:48px; padding:0 16px; border:none; border-radius:12px; background:var(--pink-dark); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; width:100%; text-decoration:none; }
  .btn:disabled { opacity:.45; }
  .btn.ghost { background:#fff; color:var(--pink-dark); border:2px solid var(--pink-dark); }
  .btn.sm { min-height:38px; width:auto; font-size:.88rem; padding:0 12px; border-radius:10px; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btn-row > * { flex:1 1 auto; }
  .file-btn { position:relative; overflow:hidden; }
  .file-btn input[type=file] { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
  #camVideo { width:100%; border-radius:14px; background:#000; display:none; aspect-ratio:3/4; object-fit:cover; }
  .muted { color:var(--muted); font-size:.88rem; }
  .tag { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--pink); color:var(--muted); font-size:.78rem; font-weight:600; }
  .qr-no { font-weight:800; letter-spacing:.4px; }
  .product { background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .product .name { font-weight:800; font-size:1rem; }
  .product .meta { font-size:.85rem; color:var(--muted); margin-top:2px; }
  .product .price { font-weight:800; margin-top:4px; }
  .low { color:var(--danger); font-weight:700; }
  .big { font-weight:800; font-size:1.1rem; word-break:break-word; }
  .status { font-size:.82rem; color:var(--muted); text-align:center; margin:8px 0 0; }
  .empty { text-align:center; padding:24px 10px; color:var(--muted); }
  .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .25s; max-width:90vw; text-align:center; z-index:40; }
  .toast.show { opacity:1; }
  .result { margin-top:12px; }
</style>
</head>
<body>

<header>
  <h1>ARS Super Store</h1>
  <p>Scan a product QR to see its price and stock</p>
</header>

<main>
  <!-- Scanner -->
  <section class="card">
    <h2>Scan QR code</h2>
    <video id="camVideo" playsinline muted></video>
    <p class="muted" id="camHint" style="margin-top:8px;">Camera is off.</p>
    <div class="btn-row">
      <button class="btn" id="camStart">Start camera</button>
      <button class="btn ghost" id="camStop" disabled>Stop</button>
    </div>
    <div class="btn-row">
      <label class="btn ghost file-btn">Upload QR photo
        <input type="file" id="qrFile" accept="image/*">
      </label>
    </div>
    <div class="result" id="readResult"><p class="muted">Scan a code to see the product here.</p></div>
  </section>

  <!-- Manual lookup -->
  <section class="card">
    <h2>Find a product</h2>
    <div class="btn-row" style="margin-top:0;">
      <input id="manualQr" placeholder="Type QR No, e.g. ARS-QR-0001" style="flex:2 1 180px;">
      <button class="btn sm" id="manualBtn" style="flex:1 1 80px;min-height:48px;">Find</button>
    </div>
  </section>

  <!-- Catalog -->
  <section class="card">
    <h2>All products</h2>
    <input id="search" type="search" placeholder="Search name, SKU or QR No" style="margin-bottom:12px;">
    <div id="list"></div>
    <p class="empty" id="emptyMsg">Loading products…</p>
    <p class="status" id="status"></p>
  </section>
</main>

<canvas id="scanCanvas" style="display:none;"></canvas>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" onerror="loadBackupJsQR()"></script>
<script>
  function loadBackupJsQR() {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onerror = function () { alert("QR reader library could not load. Check your internet connection and reload."); };
    document.head.appendChild(s);
  }
</script>
<script>
(function () {
  "use strict";

  // ===== CONFIG: same database URL as the admin app =====
  const CLOUD_DB_URL = "https://ars-super-store-default-rtdb.firebaseio.com";
  const REFRESH_MS = 30000; // auto-refresh every 30 seconds
  const CACHE_KEY = "arsReaderCache_v1";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let products = [];
  let timer;

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function configured() {
    return CLOUD_DB_URL && !CLOUD_DB_URL.includes("YOUR-PROJECT");
  }

  // ----- Load products from the database -----
  async function loadProducts(silent) {
    if (!configured()) {
      $("emptyMsg").textContent = "Website not configured yet. Set CLOUD_DB_URL in the code.";
      return;
    }
    try {
      const res = await fetch(CLOUD_DB_URL.replace(/\/$/, "") + "/products.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      products = data ? Object.values(data) : [];
      products.sort((a, b) => String(a.qrNo).localeCompare(String(b.qrNo)));
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(products)); } catch (e) {}
      $("status").textContent = "Updated " + new Date().toLocaleTimeString();
      if (!silent) toast(`${products.length} products loaded`);
    } catch (err) {
      try { products = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]"); } catch (e) { products = []; }
      $("status").textContent = "Offline. Showing last saved list.";
    }
    renderList();
  }

  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const list = products.filter(p =>
      !q || [p.name, p.sku, p.qrNo, p.category].some(v => String(v || "").toLowerCase().includes(q))
    );
    $("emptyMsg").style.display = list.length ? "none" : "block";
    if (!list.length && configured()) $("emptyMsg").textContent = "No products found.";
    $("list").innerHTML = list.map(p => `
      <div class="product" data-qr="${esc(p.qrNo)}" style="cursor:pointer;">
        <div class="name">${esc(p.name)}</div>
        <div class="meta"><span class="qr-no">${esc(p.qrNo)}</span> · SKU ${esc(p.sku)} · <span class="tag">${esc(p.category)}</span></div>
        <div class="price">${money(p.price)} · Stock: <span class="${Number(p.stock) < 10 ? "low" : ""}">${p.stock}</span></div>
      </div>`).join("");
  }

  $("search").addEventListener("input", renderList);
  $("list").addEventListener("click", (e) => {
    const card = e.target.closest("[data-qr]");
    if (card) showProduct(card.dataset.qr, true);
  });

  // ----- Lookup and display -----
  function findProduct(raw) {
    return products.find(p => raw === p.qrNo || raw.includes(p.qrNo) || raw.endsWith("/" + encodeURIComponent(p.qrNo)));
  }

  function showProduct(qrNo) {
    const p = products.find(x => x.qrNo === qrNo);
    if (!p) return;
    const link = p.qrUrl && /^https?:\/\//i.test(p.qrUrl) ? p.qrUrl : "";
    $("readResult").innerHTML = `
      <div class="big">${esc(p.name)}</div>
      <div class="muted" style="margin-top:4px;"><span class="qr-no">${esc(p.qrNo)}</span> · SKU ${esc(p.sku)}</div>
      <div style="margin-top:6px;font-weight:800;">${money(p.price)} · Stock: <span class="${Number(p.stock) < 10 ? "low" : ""}">${p.stock}</span></div>
      <div class="muted">${esc(p.category)}${p.desc ? " · " + esc(p.desc) : ""}</div>
      ${link ? `<div class="btn-row"><a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">Open product page</a></div>` : ""}`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function lookup(text) {
    const raw = String(text || "").trim();
    if (!raw) { toast("Nothing to read"); return; }
    const found = findProduct(raw);
    if (found) {
      showProduct(found.qrNo);
      toast("Product found");
    } else {
      const isUrl = /^https?:\/\//i.test(raw);
      $("readResult").innerHTML = `
        <div class="big">${esc(raw)}</div>
        <p class="muted" style="margin-top:6px;">No matching product in the catalog.</p>
        ${isUrl ? `<div class="btn-row"><a class="btn sm" href="${esc(raw)}" target="_blank" rel="noopener">Open link</a></div>` : ""}`;
    }
  }

  $("manualBtn").addEventListener("click", () => lookup($("manualQr").value));
  $("manualQr").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup($("manualQr").value); });

  // ----- Camera scanner -----
  const video = $("camVideo");
  const scanCanvas = $("scanCanvas");
  const sctx = scanCanvas.getContext("2d", { willReadFrequently: true });
  let stream = null, scanning = false, rafId = null;

  async function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("Camera not supported here. Use Upload QR photo.");
      return;
    }
    if (typeof jsQR === "undefined") { toast("QR library failed to load"); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (err) {
      toast("Camera blocked. Allow access or use Upload QR photo.");
      return;
    }
    video.srcObject = stream;
    video.style.display = "block";
    video.setAttribute("playsinline", "");
    try { await video.play(); } catch (e) {}
    $("camHint").textContent = "Point the camera at a QR code…";
    $("camStart").disabled = true;
    $("camStop").disabled = false;
    scanning = true;
    scanLoop();
  }

  function stopCam() {
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    video.style.display = "none";
    $("camHint").textContent = "Camera is off.";
    $("camStart").disabled = false;
    $("camStop").disabled = true;
  }

  function scanLoop() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
      const w = video.videoWidth, h = video.videoHeight;
      scanCanvas.width = w; scanCanvas.height = h;
      sctx.drawImage(video, 0, 0, w, h);
      const img = sctx.getImageData(0, 0, w, h);
      const code = jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
      if (code && code.data) {
        stopCam();
        lookup(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(scanLoop);
  }

  $("camStart").addEventListener("click", startCam);
  $("camStop").addEventListener("click", stopCam);

  $("qrFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof jsQR === "undefined") { toast("QR library failed to load"); return; }
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      scanCanvas.width = Math.round(img.width * scale);
      scanCanvas.height = Math.round(img.height * scale);
      sctx.drawImage(img, 0, 0, scanCanvas.width, scanCanvas.height);
      const d = sctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      const code = jsQR(d.data, scanCanvas.width, scanCanvas.height, { inversionAttempts: "attemptBoth" });
      if (code && code.data) lookup(code.data);
      else {
        $("readResult").innerHTML = `<p class="muted">No QR code found in that photo. Try a closer, sharper picture.</p>`;
        toast("No QR found");
      }
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    e.target.value = "";
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopCam();
    else loadProducts(true);
  });

  // ----- Init: load, then keep refreshing so new uploads appear automatically -----
  try { products = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]"); } catch (e) {}
  renderList();
  loadProducts(true);
  timer = setInterval(() => loadProducts(true), REFRESH_MS);
})();
</script>
</body>
</html>
