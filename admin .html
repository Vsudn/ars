<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#f9a8d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ARS Super Store - QR</title>
<style>
  :root {
    --pink: #fce7f3;
    --pink-deep: #f9a8d4;
    --pink-dark: #db2777;
    --card: #ffffff;
    --text: #000000;
    --muted: #374151;
    --border: #f3c4dd;
    --danger: #dc2626;
    --ok: #15803d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--pink);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--pink-dark);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: .3px; }
  header p { font-size: .78rem; opacity: .95; margin-top: 2px; }

  main { padding: 14px; max-width: 640px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  h2 { font-size: 1.1rem; margin-bottom: 10px; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
  input, select, textarea {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font-size: 16px; /* prevents iOS zoom */
    -webkit-appearance: none;
    appearance: none;
  }
  select { background-image: linear-gradient(45deg, transparent 50%, #6b7280 50%), linear-gradient(135deg, #6b7280 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
  input:focus, select:focus { outline: 2px solid var(--pink-dark); border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 0 16px;
    border: none; border-radius: 12px;
    background: var(--pink-dark); color: #fff;
    font-size: 1rem; font-weight: 700;
    cursor: pointer; width: 100%;
    text-decoration: none;
    transition: transform .08s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: #fff; color: var(--pink-dark); border: 2px solid var(--pink-dark); }
  .btn.dark { background: #111827; }
  .btn.sm { min-height: 38px; font-size: .88rem; width: auto; padding: 0 12px; border-radius: 10px; }
  .btn.danger { background: #fff; color: var(--danger); border: 2px solid var(--danger); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn-row > * { flex: 1 1 auto; }

  .muted { color: var(--muted); font-size: .88rem; }
  .qr-no { font-weight: 800; font-size: 1.05rem; letter-spacing: .4px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--pink); color: var(--muted); font-size: .78rem; font-weight: 600; }
  .error { color: var(--danger); font-size: .88rem; min-height: 1.2em; margin-top: 8px; }

  /* Products list */
  .search-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
  .stat strong { display: block; font-size: 1.25rem; color: var(--pink-dark); }
  .stat span { font-size: .78rem; color: var(--muted); }
  .product {
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .qr-thumb { width: 78px; height: 78px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .qr-thumb img, .qr-thumb canvas { width: 72px !important; height: 72px !important; }
  .product-info .name { font-weight: 800; font-size: 1rem; }
  .product-info .meta { font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .product-info .price { font-weight: 800; margin-top: 4px; }
  .low { color: var(--danger); font-weight: 700; }
  .product .btn-row { margin-top: 8px; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }

  /* QR view */
  .qr-stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 280px; border: 2px dashed var(--border); border-radius: 14px; padding: 14px; background: #fff;
  }
  .qr-stage canvas, .qr-stage img { width: 240px; height: 240px; max-width: 100%; height: auto; }
  .result-name { font-weight: 800; font-size: 1.1rem; margin-top: 12px; text-align: center; }
  .result-sub { font-size: .88rem; color: var(--muted); text-align: center; margin-top: 4px; }

  /* Scan */
  #camVideo { width: 100%; border-radius: 14px; background: #000; display: none; aspect-ratio: 3 / 4; object-fit: cover; }
  .scan-box { position: relative; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .result { margin-top: 12px; }
  .result .big { font-weight: 800; font-size: 1.1rem; word-break: break-word; }

  /* Bottom nav */
  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: #fff;
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 10px rgba(0,0,0,.05);
  }
  nav.bottom button {
    background: none; border: none; color: var(--muted);
    padding: 10px 4px 12px; font-size: .75rem; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; min-height: 62px;
  }
  nav.bottom button .ic { font-size: 1.35rem; line-height: 1; }
  nav.bottom button.active { color: var(--pink-dark); }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 90vw; text-align: center; z-index: 40;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 560px) {
    .search-row { grid-template-columns: 2fr 1fr; }
  }
  @media print {
    header, nav.bottom, .no-print, .toast { display: none !important; }
    body { background: #fff; padding: 0; }
    .view { display: block !important; }
  }
</style>
</head>
<body>

<header>
  <h1>ARS Super Store</h1>
  <p>Vadalure, Cuddalore, Tamil Nadu 607303</p>
</header>

<main>

  <!-- ============ PRODUCTS ============ -->
  <section class="view active" id="view-products">
    <div class="stats">
      <div class="stat"><strong id="statTotal">0</strong><span>Products</span></div>
      <div class="stat"><strong id="statLow">0</strong><span>Low stock (&lt;10)</span></div>
    </div>
    <div class="search-row">
      <input id="search" type="search" placeholder="Search name, SKU or QR No">
      <select id="filterCat"><option value="">All categories</option></select>
    </div>
    <div id="productList"></div>
    <p class="empty" id="emptyMsg" style="display:none;">No products found.</p>

    <div class="card no-print" style="margin-top:18px;">
      <h2>Store settings</h2>
      <label for="storeName">Store name</label>
      <input id="storeName" value="ARS Super Store">
      <label for="storeUrl">Base URL for product QR links (optional)</label>
      <input id="storeUrl" type="url" placeholder="https://www.yourstore.com/product/">
      <div class="btn-row">
        <button class="btn ghost" id="exportBtn">Export catalog</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="syncAllBtn">Sync all to website</button>
      </div>
    </div>
  </section>

  <!-- ============ ADD / EDIT ============ -->
  <section class="view" id="view-add">
    <div class="card">
      <h2 id="formTitle">Add product</h2>
      <form id="productForm" autocomplete="off">
        <label for="pName">Product name *</label>
        <input id="pName" placeholder="e.g. Basmati Rice 5kg" required>

        <div class="row">
          <div>
            <label for="pSku">SKU / barcode *</label>
            <input id="pSku" placeholder="SS-1001" required>
          </div>
          <div>
            <label for="pCategory">Category</label>
            <select id="pCategory">
              <option>Grocery</option>
              <option>Dairy</option>
              <option>Beverages</option>
              <option>Snacks</option>
              <option>Fruits &amp; Vegetables</option>
              <option>Personal Care</option>
              <option>Household</option>
              <option>Frozen</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="pPrice">Price (₹) *</label>
            <input id="pPrice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div>
            <label for="pStock">Stock qty</label>
            <input id="pStock" type="number" inputmode="numeric" min="0" placeholder="0">
          </div>
        </div>

        <label for="pDesc">Description</label>
        <input id="pDesc" placeholder="Short description">

        <div class="btn-row">
          <button class="btn" type="submit" id="submitBtn">Save &amp; generate QR</button>
        </div>
        <div class="btn-row">
          <button class="btn ghost" type="button" id="cancelEdit" style="display:none;">Cancel edit</button>
        </div>
        <div class="error" id="formError"></div>
      </form>
    </div>
  </section>

  <!-- ============ QR GENERATOR ============ -->
  <section class="view" id="view-qr">
    <div class="card">
      <h2>QR code</h2>
      <div class="qr-stage" id="qrBox">
        <p class="muted">Tap "QR" on a product to show its code here.</p>
      </div>
      <div class="result-name" id="qrName"></div>
      <div class="qr-no result-sub" id="qrNumber"></div>
      <div class="result-sub" id="qrSub"></div>
      <div class="btn-row no-print">
        <button class="btn" id="downloadPng">Download PNG</button>
        <button class="btn ghost" id="printQr">Print label</button>
      </div>
    </div>

    <div class="card no-print">
      <h2>Custom QR (any text or link)</h2>
      <label for="customText">Text or URL</label>
      <input id="customText" type="text" placeholder="https://yourstore.com/offers">
      <div class="btn-row">
        <button class="btn dark" id="customBtn">Generate QR</button>
      </div>
    </div>
  </section>

  <!-- ============ SCANNER ============ -->
  <section class="view" id="view-scan">
    <div class="card">
      <h2>QR reader</h2>
      <div class="scan-box">
        <video id="camVideo" playsinline muted></video>
      </div>
      <p class="muted" id="camHint" style="margin-top:8px;">Camera is off.</p>
      <div class="btn-row">
        <button class="btn" id="camStart">Start camera</button>
        <button class="btn ghost" id="camStop" disabled>Stop</button>
      </div>
      <div class="btn-row">
        <label class="btn ghost file-btn">Upload QR photo
          <input type="file" id="qrFile" accept="image/*">
        </label>
      </div>
    </div>

    <div class="card">
      <label for="manualQr" style="margin-top:0;">Or type a QR No / text</label>
      <div class="btn-row" style="margin-top:6px;">
        <input id="manualQr" placeholder="ARS-QR-0001" style="flex:2 1 180px;">
        <button class="btn sm" id="manualBtn" style="flex:1 1 80px;min-height:48px;">Read</button>
      </div>
      <div class="result" id="readResult">
        <p class="muted">Scan a QR code to see the product here.</p>
      </div>
    </div>
    <canvas id="scanCanvas" style="display:none;"></canvas>
  </section>

</main>

<nav class="bottom no-print">
  <button data-view="view-products" class="active"><span class="ic">🛒</span>Products</button>
  <button data-view="view-add"><span class="ic">➕</span>Add</button>
  <button data-view="view-qr"><span class="ic">▦</span>QR</button>
  <button data-view="view-scan"><span class="ic">📷</span>Scan</button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const STORE_KEY = "arsSuperStore_v2";
  // Paste your Firebase Realtime Database URL here, e.g. https://your-project-default-rtdb.firebaseio.com
  const CLOUD_DB_URL = "https://ars-super-store-default-rtdb.firebaseio.com";

  // ---------- Data ----------
  const SAMPLE = [
    { id: 1, name: "Basmati Rice 5kg", sku: "SS-1001", category: "Grocery", price: 540, stock: 120, desc: "Premium long grain" },
    { id: 2, name: "Full Cream Milk 1L", sku: "SS-2001", category: "Dairy", price: 68, stock: 45, desc: "Pasteurised" },
    { id: 3, name: "Orange Juice 1L", sku: "SS-3001", category: "Beverages", price: 120, stock: 8, desc: "100% fruit" },
    { id: 4, name: "Potato Chips Classic", sku: "SS-4001", category: "Snacks", price: 30, stock: 200, desc: "Lightly salted" },
    { id: 5, name: "Fresh Bananas 1kg", sku: "SS-5001", category: "Fruits & Vegetables", price: 60, stock: 3, desc: "Farm fresh" }
  ];

  let state = { products: [], nextId: 1, nextQrSeq: 1, storeName: "ARS Super Store", storeUrl: "" };
  let editingId = null;
  let currentQR = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { state = { ...state, ...JSON.parse(raw) }; return; }
    } catch (e) { /* storage unavailable: fall back to memory */ }
    state.products = SAMPLE.map((p, i) => ({ ...p, qrNo: "ARS-QR-" + String(i + 1).padStart(4, "0") }));
    state.nextId = SAMPLE.length + 1;
    state.nextQrSeq = SAMPLE.length + 1;
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  // ---------- Cloud sync (uploads to the QR reader website's database) ----------
  function cloudEnabled() {
    return CLOUD_DB_URL && !CLOUD_DB_URL.includes("YOUR-PROJECT");
  }

  async function syncProduct(p) {
    if (!cloudEnabled()) return;
    try {
      const url = `${CLOUD_DB_URL.replace(/\/$/, "")}/products/${encodeURIComponent(p.qrNo)}.json`;
      const res = await fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: p.id, qrNo: p.qrNo, name: p.name, sku: p.sku, category: p.category,
          price: p.price, stock: p.stock, desc: p.desc || "",
          store: state.storeName, qrUrl: productUrl(p),
          updatedAt: new Date().toISOString()
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      toast("Uploaded to QR reader website ✓");
    } catch (err) {
      toast("Upload failed. Check internet and database rules.");
    }
  }

  async function removeFromCloud(p) {
    if (!cloudEnabled()) return;
    try {
      const url = `${CLOUD_DB_URL.replace(/\/$/, "")}/products/${encodeURIComponent(p.qrNo)}.json`;
      const res = await fetch(url, { method: "DELETE" });
      if (!res.ok) throw new Error("HTTP " + res.status);
    } catch (err) {
      toast("Could not remove from website");
    }
  }

  async function syncAll() {
    if (!cloudEnabled()) return toast("Set CLOUD_DB_URL in the code first");
    let ok = 0;
    for (const p of state.products) {
      try {
        const url = `${CLOUD_DB_URL.replace(/\/$/, "")}/products/${encodeURIComponent(p.qrNo)}.json`;
        const res = await fetch(url, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: p.id, qrNo: p.qrNo, name: p.name, sku: p.sku, category: p.category,
            price: p.price, stock: p.stock, desc: p.desc || "", store: state.storeName,
            qrUrl: productUrl(p), updatedAt: new Date().toISOString() })
        });
        if (res.ok) ok++;
      } catch (e) { /* counted as failed */ }
    }
    toast(`Synced ${ok} of ${state.products.length} products`);
  }

  // ---------- Helpers ----------
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  function productUrl(p) {
    const base = state.storeUrl.trim();
    if (base) return base.replace(/\/?$/, "/") + encodeURIComponent(p.qrNo);
    return `${state.storeName || "ARS Super Store"} | ${p.name} | QR No: ${p.qrNo} | SKU: ${p.sku} | ${money(p.price)}`;
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === id));
    document.querySelectorAll("nav.bottom button").forEach(b => b.classList.toggle("active", b.dataset.view === id));
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
  document.querySelectorAll("nav.bottom button").forEach(b =>
    b.addEventListener("click", () => {
      if (b.dataset.view !== "view-add") resetForm();
      if (b.dataset.view !== "view-scan") stopCam();
      showView(b.dataset.view);
    })
  );

  // ---------- Products list ----------
  function renderStats() {
    $("statTotal").textContent = state.products.length;
    $("statLow").textContent = state.products.filter(p => p.stock < 10).length;
  }

  function renderCategories() {
    const sel = $("filterCat");
    const cur = sel.value;
    const cats = [...new Set(state.products.map(p => p.category))].sort();
    sel.innerHTML = `<option value="">All categories</option>` + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    sel.value = cats.includes(cur) ? cur : "";
  }

  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const cat = $("filterCat").value;
    const list = state.products.filter(p =>
      (!cat || p.category === cat) &&
      (!q || [p.name, p.sku, p.qrNo, p.category].some(v => String(v).toLowerCase().includes(q)))
    );
    $("emptyMsg").style.display = list.length ? "none" : "block";
    $("productList").innerHTML = list.map(p => `
      <article class="product">
        <div class="qr-thumb" data-text="${esc(productUrl(p))}"></div>
        <div class="product-info">
          <div class="name">${esc(p.name)}</div>
          <div class="meta"><span class="qr-no">${esc(p.qrNo)}</span> · SKU ${esc(p.sku)}</div>
          <div class="meta"><span class="tag">${esc(p.category)}</span></div>
          <div class="price">${money(p.price)} · Stock: <span class="${p.stock < 10 ? "low" : ""}">${p.stock}</span></div>
          <div class="btn-row">
            <button class="btn sm" data-act="qr" data-id="${p.id}">Show QR</button>
            <button class="btn sm ghost" data-act="edit" data-id="${p.id}">Edit</button>
            <button class="btn sm danger" data-act="del" data-id="${p.id}">Delete</button>
          </div>
        </div>
      </article>`).join("");

    if (typeof QRCode !== "undefined") {
      document.querySelectorAll("#productList .qr-thumb").forEach(el => {
        new QRCode(el, { text: el.dataset.text, width: 72, height: 72, correctLevel: QRCode.CorrectLevel.M });
      });
    }
  }

  function refreshAll() {
    renderStats();
    renderCategories();
    renderList();
    saveState();
  }

  $("search").addEventListener("input", renderList);
  $("filterCat").addEventListener("change", renderList);

  $("productList").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const p = state.products.find(x => x.id === id);
    if (!p) return;

    if (btn.dataset.act === "qr") {
      showProductQR(p);
      showView("view-qr");
    } else if (btn.dataset.act === "edit") {
      editingId = id;
      $("pName").value = p.name;
      $("pSku").value = p.sku;
      $("pCategory").value = p.category;
      $("pPrice").value = p.price;
      $("pStock").value = p.stock;
      $("pDesc").value = p.desc || "";
      $("formTitle").textContent = `Edit product · ${p.qrNo}`;
      $("submitBtn").textContent = "Update & regenerate QR";
      $("cancelEdit").style.display = "flex";
      showView("view-add");
    } else if (btn.dataset.act === "del") {
      if (confirm(`Delete "${p.name}" (${p.qrNo})?`)) {
        state.products = state.products.filter(x => x.id !== id);
        refreshAll();
        removeFromCloud(p);
        toast("Product deleted");
      }
    }
  });

  // ---------- QR generation ----------
  function renderQR(text, name, sub, qrNo) {
    const box = $("qrBox");
    box.innerHTML = "";
    if (typeof QRCode === "undefined") {
      box.innerHTML = `<p class="error">QR library failed to load. Check your connection.</p>`;
      return;
    }
    new QRCode(box, { text, width: 240, height: 240, colorDark: "#000", colorLight: "#fff", correctLevel: QRCode.CorrectLevel.H });
    $("qrName").textContent = name;
    $("qrNumber").textContent = qrNo ? "QR No: " + qrNo : "";
    $("qrSub").textContent = sub;
  }

  function showProductQR(p) {
    currentQR = { filename: p.qrNo || "QR" };
    renderQR(productUrl(p), p.name, `SKU ${p.sku} · ${money(p.price)} · ${state.storeName}`, p.qrNo);
  }

  function qrDataURL() {
    const c = $("qrBox").querySelector("canvas");
    if (c) return c.toDataURL("image/png");
    const i = $("qrBox").querySelector("img");
    return i ? i.src : null;
  }

  $("downloadPng").addEventListener("click", () => {
    const url = qrDataURL();
    if (!url) return toast("Show a QR code first");
    const a = document.createElement("a");
    a.href = url;
    a.download = (currentQR?.filename || "QR") + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    toast("PNG saved");
  });

  $("printQr").addEventListener("click", () => {
    const url = qrDataURL();
    if (!url) return toast("Show a QR code first");
    const w = window.open("", "_blank");
    if (!w) return toast("Allow pop-ups to print");
    w.document.write(`<html><head><title>${esc($("qrName").textContent)}</title>
      <style>body{font-family:system-ui;text-align:center;padding:30px}img{width:260px;max-width:90%}</style>
      </head><body><h2>${esc(state.storeName)}</h2><p>Vadalure, Cuddalore, Tamil Nadu 607303</p>
      <img src="${url}"><h3>${esc($("qrName").textContent)}</h3>
      <p>${esc($("qrNumber").textContent)}</p><p>${esc($("qrSub").textContent)}</p>
      <script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`);
    w.document.close();
  });

  $("customBtn").addEventListener("click", () => {
    const txt = $("customText").value.trim();
    if (!txt) return toast("Enter text or a URL");
    currentQR = { filename: "QR_custom" };
    renderQR(txt, "Custom QR", "Custom content", "");
  });

  // ---------- Add / edit form ----------
  function resetForm() {
    $("productForm").reset();
    editingId = null;
    $("formTitle").textContent = "Add product";
    $("submitBtn").textContent = "Save & generate QR";
    $("cancelEdit").style.display = "none";
    $("formError").textContent = "";
  }
  $("cancelEdit").addEventListener("click", () => { resetForm(); showView("view-products"); });

  $("productForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("pName").value.trim();
    const sku = $("pSku").value.trim();
    const price = parseFloat($("pPrice").value);
    if (!name || !sku || isNaN(price) || price < 0) {
      $("formError").textContent = "Enter name, SKU and a valid price.";
      return;
    }
    if (state.products.some(p => p.sku.toLowerCase() === sku.toLowerCase() && p.id !== editingId)) {
      $("formError").textContent = "This SKU already exists.";
      return;
    }
    const data = {
      name, sku, price,
      category: $("pCategory").value,
      stock: parseInt($("pStock").value || "0", 10),
      desc: $("pDesc").value.trim()
    };
    let product;
    if (editingId) {
      product = state.products.find(p => p.id === editingId);
      Object.assign(product, data);
      toast("Product updated");
    } else {
      product = { id: state.nextId++, qrNo: "ARS-QR-" + String(state.nextQrSeq++).padStart(4, "0"), ...data };
      state.products.push(product);
      toast(`Saved · ${product.qrNo}`);
    }
    refreshAll();
    syncProduct(product);
    resetForm();
    showProductQR(product);
    showView("view-qr");
  });

  // ---------- Export ----------
  $("exportBtn").addEventListener("click", () => {
    const json = JSON.stringify({ store: state.storeName, exportedAt: new Date().toISOString(), products: state.products }, null, 2);
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(json);
    a.download = "ars-super-store-catalog.json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Catalog exported");
  });

  $("syncAllBtn").addEventListener("click", syncAll);

  $("storeName").addEventListener("change", () => { state.storeName = $("storeName").value.trim() || "ARS Super Store"; saveState(); });
  $("storeUrl").addEventListener("change", () => { state.storeUrl = $("storeUrl").value.trim(); saveState(); });

  // ---------- QR reader ----------
  const video = $("camVideo");
  const scanCanvas = $("scanCanvas");
  const sctx = scanCanvas.getContext("2d", { willReadFrequently: true });
  let stream = null, scanning = false, rafId = null;

  function lookup(text) {
    const raw = String(text || "").trim();
    const box = $("readResult");
    if (!raw) { toast("Nothing to read"); return; }
    const found = state.products.find(p =>
      raw === p.qrNo || raw.includes(p.qrNo) || raw.endsWith("/" + encodeURIComponent(p.qrNo))
    );
    if (found) {
      box.innerHTML = `
        <div class="big">${esc(found.name)}</div>
        <div class="muted" style="margin-top:4px;"><span class="qr-no">${esc(found.qrNo)}</span> · SKU ${esc(found.sku)}</div>
        <div style="margin-top:6px;font-weight:800;">${money(found.price)} · Stock: ${found.stock}</div>
        <div class="muted">${esc(found.category)}${found.desc ? " · " + esc(found.desc) : ""}</div>
        <div class="btn-row"><button class="btn sm" id="showFoundQr">Show this QR</button></div>`;
      $("showFoundQr").addEventListener("click", () => { showProductQR(found); showView("view-qr"); });
      toast("Product found");
    } else {
      const isUrl = /^https?:\/\//i.test(raw);
      box.innerHTML = `
        <div class="big">${esc(raw)}</div>
        <p class="muted" style="margin-top:6px;">No matching product in the catalog.</p>
        ${isUrl ? `<div class="btn-row"><a class="btn sm" href="${esc(raw)}" target="_blank" rel="noopener">Open link</a></div>` : ""}`;
    }
  }

  async function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("Camera not supported in this browser. Use Upload photo.");
      return;
    }
    if (typeof jsQR === "undefined") { toast("QR library failed to load"); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (err) {
      toast("Camera blocked. Allow camera access or use Upload photo.");
      return;
    }
    video.srcObject = stream;
    video.style.display = "block";
    video.setAttribute("playsinline", "");
    try { await video.play(); } catch (e) { /* autoplay handled by muted */ }
    $("camHint").textContent = "Point the camera at a QR code…";
    $("camStart").disabled = true;
    $("camStop").disabled = false;
    scanning = true;
    scanLoop();
  }

  function stopCam() {
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    video.style.display = "none";
    $("camHint").textContent = "Camera is off.";
    $("camStart").disabled = false;
    $("camStop").disabled = true;
  }

  function scanLoop() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        scanCanvas.width = w; scanCanvas.height = h;
        sctx.drawImage(video, 0, 0, w, h);
        const img = sctx.getImageData(0, 0, w, h);
        const code = jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          stopCam();
          lookup(code.data);
          return;
        }
      }
    }
    rafId = requestAnimationFrame(scanLoop);
  }

  $("camStart").addEventListener("click", startCam);
  $("camStop").addEventListener("click", stopCam);

  $("qrFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof jsQR === "undefined") { toast("QR library failed to load"); return; }
    const img = new Image();
    img.onload = () => {
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      scanCanvas.width = Math.round(img.width * scale);
      scanCanvas.height = Math.round(img.height * scale);
      sctx.drawImage(img, 0, 0, scanCanvas.width, scanCanvas.height);
      const d = sctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      const code = jsQR(d.data, scanCanvas.width, scanCanvas.height, { inversionAttempts: "attemptBoth" });
      if (code && code.data) {
        lookup(code.data);
      } else {
        $("readResult").innerHTML = `<p class="muted">No QR code found in that photo. Try a closer, sharper picture.</p>`;
        toast("No QR found");
      }
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    e.target.value = "";
  });

  $("manualBtn").addEventListener("click", () => lookup($("manualQr").value));
  $("manualQr").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup($("manualQr").value); });

  document.addEventListener("visibilitychange", () => { if (document.hidden) stopCam(); });

  // ---------- Init ----------
  loadState();
  $("storeName").value = state.storeName;
  $("storeUrl").value = state.storeUrl;
  refreshAll();
  showProductQR(state.products[0]);
})();
</script>
</body>
</html>
